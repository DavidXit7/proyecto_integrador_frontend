<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Usuario</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    
    <div id="vistaMenuUsuario" class="vista">

        <div class="vistaHeader">
            <h1>Mis Tareas</h1>
            <a href="/index.html" class="btn btnSecondary">Volver</a>
        </div>

        <div class="seccionMenuUsuario">
            <!-- Selección de usuario -->
            <div class="seleccionUsuario">
                <h2 class="formTitle">Seleccionar Usuario</h2>
                <div class="ucFormGroup">
                    <label for="selectorUsuario" class="ucFormLabel">Usuario:</label>
                    <select id="selectorUsuario" class="ucFormInput">
                        <option value="">Seleccione un usuario...</option>
                    </select>
                </div>
                <button id="btnVerTareas" class="btn btnPrimary" disabled>Ver Mis Tareas</button>
            </div>

            <!-- Filtros de tareas -->
            <div class="filtrosTareas" id="seccionFiltros" style="display: none;">
                <h3>Filtrar Tareas</h3>
                <div class="filtrosControles">
                    <div class="ucFormGroup">
                        <label for="filtroEstadoUsuario" class="ucFormLabel">Estado:</label>
                        <select id="filtroEstadoUsuario" class="ucFormInput">
                            <option value="">Todos los estados</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="en proceso">En proceso</option>
                            <option value="completada">Completada</option>
                        </select>
                    </div>
                    <button id="btnLimpiarFiltrosUsuario" class="btn btnSecondary">Limpiar Filtros</button>
                </div>
            </div>

            <!-- Resumen de tareas -->
            <div class="resumenTareas" id="seccionResumen" style="display: none;">
                <h3>Resumen de Tareas</h3>
                <div class="resumenContenido">
                    <div class="resumenItem">
                        <span class="resumenLabel">Total:</span>
                        <span class="resumenValor" id="totalTareas">0</span>
                    </div>
                    <div class="resumenItem">
                        <span class="resumenLabel">Pendientes:</span>
                        <span class="resumenValor pendiente" id="tareasPendientes">0</span>
                    </div>
                    <div class="resumenItem">
                        <span class="resumenLabel">En proceso:</span>
                        <span class="resumenValor enProceso" id="tareasEnProceso">0</span>
                    </div>
                    <div class="resumenItem">
                        <span class="resumenLabel">Completadas:</span>
                        <span class="resumenValor completada" id="tareasCompletadas">0</span>
                    </div>
                </div>
            </div>

            <!-- Lista de tareas del usuario -->
            <div class="tareasUsuario" id="seccionTareas" style="display: none;">
                <h3>Mis Tareas Asignadas</h3>
                <div id="listaTareasUsuario" class="listaTareas">
                    <!-- Las tareas se cargarán aquí dinámicamente -->
                </div>
            </div>

            <!-- Mensaje de no tareas -->
            <div class="sinTareas" id="mensajeSinTareas" style="display: none;">
                <p>No tienes tareas asignadas.</p>
            </div>
        </div>

    </div>

    <script type="module" src="/js/ui/menuUsuario.js"></script>
</body>
</html>
